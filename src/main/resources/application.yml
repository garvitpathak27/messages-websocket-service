spring:
  application:
    name: messages-websocket-service   # gateway routes lb://messages-websocket-service and lb:ws://messages-websocket-service
  cloud:
    loadbalancer:
      eager-load:
        clients:                # PLURAL. "client:" binds nothing and fails silently.
          - chat-service        # must equal messages.chat.service-id
  autoconfigure:
    # no username/password users exist here; without this Boot logs "Using generated security password: ..."
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:1s}     # amqp-client default is 60 s (Step 24 ladder: publish <= 1 s)
    channel-rpc-timeout: ${RABBITMQ_CHANNEL_RPC_TIMEOUT:1s}   # default 10 min: a hung broker would hold a request thread
    publisher-confirm-type: correlated                         # async: a NACK is logged, the write path never waits
    listener:
      simple:
        default-requeue-rejected: false     # Spring AMQP's default (true) requeues forever on any exception
        prefetch: 10
        retry:
          enabled: true                     # transient failures: 4 attempts, 1 s / 2 s / 4 s, then DLQ
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 8s
  data:
    mongodb:
      # authSource = the database the user was CREATED IN (Step 9: messages), not "the database we use".
      # Credentials have no defaults on purpose: a missing value fails startup with the variable's name.
      # socketTimeoutMS is NOT optional: the driver's default is 0, meaning an infinite read. A Mongo that
      # accepts the connection and then stops answering would hold a request thread forever (NFR5). It is
      # the third leg of the timeout ladder Step 24 writes down in full.
      uri: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@${MONGO_HOST:mongo-messages}:${MONGO_PORT:27017}/${MONGO_DATABASE:messages}?authSource=${MONGO_DATABASE:messages}&serverSelectionTimeoutMS=${MONGO_SERVER_SELECTION_TIMEOUT_MS:2000}&connectTimeoutMS=${MONGO_CONNECT_TIMEOUT_MS:2000}&socketTimeoutMS=${MONGO_SOCKET_TIMEOUT_MS:2000}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always      # without this /actuator/health is only {"status":"UP"}; Step 22 revisits
      probes:
        enabled: true           # NOT auto-enabled outside Kubernetes; liveness is Docker's healthcheck (Step 7)
      group:
        eureka:
          include: ping,diskSpace,mongo,messageIndexes   # NOT rabbit (soft), NOT discoveryComposite (a cycle)
          show-details: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}   # map key: must be camelCase defaultZone
    register-with-eureka: true
    fetch-registry: true                         # required: Step 24 calls lb://chat-service
    should-enforce-registration-at-init: false   # NFR13: boot with Eureka down
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true                              # aggregate health → Eureka instance status (proved in Step 11)
    instance-info-replication-interval-seconds: 10   # how often local status is recomputed and pushed (default 30)
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

messages:
  mongo:
    index-retry-seconds: ${MESSAGES_MONGO_INDEX_RETRY_SECONDS:5}   # no Java default: a missing block fails startup by name
  content:
    max-length: ${MESSAGES_CONTENT_MAX_LENGTH:4000}   # spec §8; counted in Unicode code points after trimming
  page:
    default-limit: ${MESSAGES_PAGE_DEFAULT_LIMIT:50}   # FR3 default; applied by the controller (Step 27)
    max-limit: ${MESSAGES_PAGE_MAX_LIMIT:100}          # FR3 max; validated in Step 27, enforced again here
  chat:
    service-id: chat-service
    room-detail-path: ${CHAT_ROOM_DETAIL_PATH}        # pinned in Step 3; no default on purpose
    connect-timeout-ms: ${CHAT_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${CHAT_READ_TIMEOUT_MS:2000}     # not raised to cover chat's own ~6.4 s auth budget (Step 24 ladder)
    retry-backoff-ms: ${CHAT_RETRY_BACKOFF_MS:200}    # one retry, connect-level failures only
  auth:
    grpc-target: ${AUTH_GRPC_TARGET:auth-service:50051}       # Compose DNS, never Eureka
    deadline-ms: ${AUTH_GRPC_DEADLINE_MS:2000}                # per call (interceptor), roadmap: 2 s
    retry-backoff-ms: ${AUTH_GRPC_RETRY_BACKOFF_MS:200}       # one retry, UNAVAILABLE only
  events:
    exchange: messages.events                        # ours: topic, durable (roadmap)
    routing-key-prefix: messages.events
    producer: messages-websocket-service
    chat:
      exchange: ${CHAT_EVENTS_EXCHANGE}              # chat-service's; pinned in Step 3
      exchange-type: ${CHAT_EVENTS_EXCHANGE_TYPE}    # pinned from `rabbitmqctl list_exchanges name type durable`
      room-deleted-routing-key: ${ROOM_DELETED_ROUTING_KEY}
      room-id-field: ${ROOM_DELETED_ROOM_ID_FIELD}
    room-deleted-queue: messages-websocket-service.room-deleted
    dead-letter-exchange: messages-websocket-service.dlx
    room-deleted-dlq: messages-websocket-service.room-deleted.dlq
    cleanup-batch-size: 500                          # roadmap
  ws:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173}   # handshake Origin check only; no CORS headers are emitted
    heartbeat-ms: ${WS_HEARTBEAT_MS:10000}                         # STOMP heart-beats; keep idle sockets alive through the gateway (Phase 12)
    inbound-threads: ${WS_INBOUND_THREADS:16}                      # CONNECT/SUBSCRIBE make blocking calls (<= 2 s auth, <= 4.2 s membership)
