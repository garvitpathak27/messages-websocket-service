# Read by docker-java (inside Testcontainers) from the test classpath.
# Docker Engine 29+ rejects API versions below 1.44, and the Testcontainers release Boot 3.5.6 manages
# otherwise starts at 1.32: "client version 1.32 is too old. Minimum supported API version is 1.44".
# 1.44 is supported by every Engine from 25.0 onward.
api.version=1.44
